<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="500" viewBox="0 0 1250 500" font-family="Segoe UI, Arial, sans-serif">
  <title>RestauranteDB - Diagrama entidad-relación</title>
  <style>
    .caja { fill: #ffffff; stroke: #1f3a5f; stroke-width: 1.5; }
    .cabecera { fill: #1f3a5f; }
    .titulo-tabla { fill: #ffffff; font-size: 16px; font-weight: 600; }
    .fila-par { fill: #f3f6fa; }
    .columna { fill: #1b1b1b; font-size: 13px; }
    .tipo { fill: #5a6573; font-size: 12px; }
    .pk { fill: #b7791f; }
    .fk { fill: #2b6cb0; }
    .uk { fill: #2f855a; }
    .insignia { fill: #ffffff; font-size: 10px; font-weight: 700; }
    .relacion { fill: none; stroke: #1f3a5f; stroke-width: 1.6; }
    .cardinalidad { fill: #1f3a5f; font-size: 13px; font-weight: 700; }
    .encabezado { fill: #1f3a5f; font-size: 20px; font-weight: 700; }
    .subtitulo { fill: #5a6573; font-size: 13px; }
    .leyenda { fill: #3d4752; font-size: 12px; }
  </style>

  <rect width="1250" height="500" fill="#ffffff"/>
  <text x="30" y="36" class="encabezado">RestauranteDB · Diagrama entidad-relación</text>
  <text x="30" y="58" class="subtitulo">Restaurante Sazón Criolla · SQL Server · Tercera Forma Normal (3FN)</text>

  <!-- ============ ZONAS ============ -->
  <g transform="translate(30,80)">
    <rect class="caja" width="260" height="136" rx="6"/>
    <path class="cabecera" d="M6,0 H254 A6,6 0 0 1 260,6 V40 H0 V6 A6,6 0 0 1 6,0 Z"/>
    <text x="14" y="26" class="titulo-tabla">dbo.Zonas</text>
    <rect class="fila-par" x="1" y="68" width="258" height="28"/>
    <g transform="translate(0,40)">
      <rect class="pk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">PK</text>
      <text x="42" y="19" class="columna">idZona</text><text x="250" y="19" class="tipo" text-anchor="end">INT IDENTITY</text>
    </g>
    <g transform="translate(0,68)">
      <rect class="uk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">UK</text>
      <text x="42" y="19" class="columna">nombre</text><text x="250" y="19" class="tipo" text-anchor="end">NVARCHAR(50)</text>
    </g>
    <g transform="translate(0,96)">
      <text x="42" y="19" class="columna">descripcion</text><text x="250" y="19" class="tipo" text-anchor="end">NVARCHAR(200) NULL</text>
    </g>
  </g>

  <!-- ============ MESAS ============ -->
  <g transform="translate(340,80)">
    <rect class="caja" width="260" height="220" rx="6"/>
    <path class="cabecera" d="M6,0 H254 A6,6 0 0 1 260,6 V40 H0 V6 A6,6 0 0 1 6,0 Z"/>
    <text x="14" y="26" class="titulo-tabla">dbo.Mesas</text>
    <rect class="fila-par" x="1" y="68" width="258" height="28"/>
    <rect class="fila-par" x="1" y="124" width="258" height="28"/>
    <rect class="fila-par" x="1" y="180" width="258" height="28"/>
    <g transform="translate(0,40)">
      <rect class="pk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">PK</text>
      <text x="42" y="19" class="columna">idMesa</text><text x="250" y="19" class="tipo" text-anchor="end">INT IDENTITY</text>
    </g>
    <g transform="translate(0,68)">
      <rect class="uk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">UK</text>
      <text x="42" y="19" class="columna">numero</text><text x="250" y="19" class="tipo" text-anchor="end">SMALLINT</text>
    </g>
    <g transform="translate(0,96)">
      <text x="42" y="19" class="columna">capacidad</text><text x="250" y="19" class="tipo" text-anchor="end">TINYINT (1..20)</text>
    </g>
    <g transform="translate(0,124)">
      <rect class="fk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">FK</text>
      <text x="42" y="19" class="columna">idZona</text><text x="250" y="19" class="tipo" text-anchor="end">INT</text>
    </g>
    <g transform="translate(0,152)">
      <text x="42" y="19" class="columna">activa</text><text x="250" y="19" class="tipo" text-anchor="end">BIT DEFAULT 1</text>
    </g>
    <g transform="translate(0,180)">
      <text x="42" y="19" class="columna">fechaCreacion</text><text x="250" y="19" class="tipo" text-anchor="end">DATETIME2(0)</text>
    </g>
  </g>

  <!-- ============ RESERVAS ============ -->
  <g transform="translate(650,80)">
    <rect class="caja" width="260" height="276" rx="6"/>
    <path class="cabecera" d="M6,0 H254 A6,6 0 0 1 260,6 V40 H0 V6 A6,6 0 0 1 6,0 Z"/>
    <text x="14" y="26" class="titulo-tabla">dbo.Reservas</text>
    <rect class="fila-par" x="1" y="68" width="258" height="28"/>
    <rect class="fila-par" x="1" y="124" width="258" height="28"/>
    <rect class="fila-par" x="1" y="180" width="258" height="28"/>
    <rect class="fila-par" x="1" y="236" width="258" height="28"/>
    <g transform="translate(0,40)">
      <rect class="pk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">PK</text>
      <text x="42" y="19" class="columna">idReserva</text><text x="250" y="19" class="tipo" text-anchor="end">INT IDENTITY</text>
    </g>
    <g transform="translate(0,68)">
      <rect class="fk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">FK</text>
      <text x="42" y="19" class="columna">idMesa</text><text x="250" y="19" class="tipo" text-anchor="end">INT</text>
    </g>
    <g transform="translate(0,96)">
      <rect class="fk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">FK</text>
      <text x="42" y="19" class="columna">idUsuario</text><text x="250" y="19" class="tipo" text-anchor="end">INT</text>
    </g>
    <g transform="translate(0,124)">
      <text x="42" y="19" class="columna">fechaInicio</text><text x="250" y="19" class="tipo" text-anchor="end">DATETIME2(0) UTC</text>
    </g>
    <g transform="translate(0,152)">
      <text x="42" y="19" class="columna">fechaFin</text><text x="250" y="19" class="tipo" text-anchor="end">DATETIME2(0) UTC</text>
    </g>
    <g transform="translate(0,180)">
      <text x="42" y="19" class="columna">numeroPersonas</text><text x="250" y="19" class="tipo" text-anchor="end">TINYINT (1..20)</text>
    </g>
    <g transform="translate(0,208)">
      <text x="42" y="19" class="columna">observaciones</text><text x="250" y="19" class="tipo" text-anchor="end">NVARCHAR(200) NULL</text>
    </g>
    <g transform="translate(0,236)">
      <text x="42" y="19" class="columna">fechaCreacion</text><text x="250" y="19" class="tipo" text-anchor="end">DATETIME2(0)</text>
    </g>
  </g>

  <!-- ============ USUARIOS ============ -->
  <g transform="translate(960,80)">
    <rect class="caja" width="260" height="220" rx="6"/>
    <path class="cabecera" d="M6,0 H254 A6,6 0 0 1 260,6 V40 H0 V6 A6,6 0 0 1 6,0 Z"/>
    <text x="14" y="26" class="titulo-tabla">dbo.Usuarios</text>
    <rect class="fila-par" x="1" y="68" width="258" height="28"/>
    <rect class="fila-par" x="1" y="124" width="258" height="28"/>
    <rect class="fila-par" x="1" y="180" width="258" height="28"/>
    <g transform="translate(0,40)">
      <rect class="pk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">PK</text>
      <text x="42" y="19" class="columna">idUsuario</text><text x="250" y="19" class="tipo" text-anchor="end">INT IDENTITY</text>
    </g>
    <g transform="translate(0,68)">
      <text x="42" y="19" class="columna">nombres</text><text x="250" y="19" class="tipo" text-anchor="end">NVARCHAR(60)</text>
    </g>
    <g transform="translate(0,96)">
      <text x="42" y="19" class="columna">apellidos</text><text x="250" y="19" class="tipo" text-anchor="end">NVARCHAR(60)</text>
    </g>
    <g transform="translate(0,124)">
      <rect class="uk" x="10" y="7" width="24" height="14" rx="3"/><text x="22" y="18" class="insignia" text-anchor="middle">UK</text>
      <text x="42" y="19" class="columna">correo</text><text x="250" y="19" class="tipo" text-anchor="end">NVARCHAR(150)</text>
    </g>
    <g transform="translate(0,152)">
      <text x="42" y="19" class="columna">telefono</text><text x="250" y="19" class="tipo" text-anchor="end">VARCHAR(15)</text>
    </g>
    <g transform="translate(0,180)">
      <text x="42" y="19" class="columna">fechaRegistro</text><text x="250" y="19" class="tipo" text-anchor="end">DATETIME2(0)</text>
    </g>
  </g>

  <!-- ============ RELACIONES (1 a muchos) ============ -->
  <!-- Zonas.idZona 1 -> N Mesas.idZona -->
  <path class="relacion" d="M290,134 H315 V218 H340"/>
  <path class="relacion" d="M298,126 V142"/>
  <path class="relacion" d="M328,218 L340,210 M328,218 L340,226"/>
  <text x="296" y="122" class="cardinalidad">1</text>
  <text x="326" y="208" class="cardinalidad">N</text>

  <!-- Mesas.idMesa 1 -> N Reservas.idMesa -->
  <path class="relacion" d="M600,134 H625 V162 H650"/>
  <path class="relacion" d="M608,126 V142"/>
  <path class="relacion" d="M638,162 L650,154 M638,162 L650,170"/>
  <text x="606" y="122" class="cardinalidad">1</text>
  <text x="636" y="152" class="cardinalidad">N</text>

  <!-- Usuarios.idUsuario 1 -> N Reservas.idUsuario -->
  <path class="relacion" d="M960,134 H935 V190 H910"/>
  <path class="relacion" d="M952,126 V142"/>
  <path class="relacion" d="M922,190 L910,182 M922,190 L910,198"/>
  <text x="948" y="122" class="cardinalidad">1</text>
  <text x="914" y="180" class="cardinalidad">N</text>

  <!-- ============ LEYENDA ============ -->
  <g transform="translate(30,400)">
    <rect class="pk" x="0" y="0" width="24" height="14" rx="3"/><text x="12" y="11" class="insignia" text-anchor="middle">PK</text>
    <text x="32" y="12" class="leyenda">Clave primaria</text>
    <rect class="fk" x="140" y="0" width="24" height="14" rx="3"/><text x="152" y="11" class="insignia" text-anchor="middle">FK</text>
    <text x="172" y="12" class="leyenda">Clave foránea (ON DELETE NO ACTION)</text>
    <rect class="uk" x="420" y="0" width="24" height="14" rx="3"/><text x="432" y="11" class="insignia" text-anchor="middle">UK</text>
    <text x="452" y="12" class="leyenda">Índice único</text>
    <text x="560" y="12" class="leyenda">1 ── N : una fila se relaciona con muchas</text>
    <text x="0" y="44" class="leyenda">Reglas en la base: CHECK de capacidad, número de personas, fechas (fin &gt; inicio), correo y teléfono · Procedimientos: dbo.RegistrarReserva, dbo.ActualizarReserva, dbo.CancelarReserva</text>
    <text x="0" y="66" class="leyenda">Vistas: dbo.vw_MesasDetalle (mesa + zona) · dbo.vw_ReservasDetalle (reserva + mesa + zona + cliente)</text>
  </g>
</svg>
